[unix_http_server]
file=/tmp/transcript-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/transcript-supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/transcript-supervisor.sock

; Start the exit observer before either service. It asks Supervisor to stop the
; peer if API or TLS exits: Docker then restarts the whole owned unit, instead
; of leaving a healthy HTTP endpoint with a dead HTTPS listener.
[eventlistener:service_exit]
command=/app/.venv/bin/python /app/docker/service_exit.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
startsecs=0
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/app/.venv/bin/python -m uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-graceful-shutdown 5
directory=/app
priority=10
startsecs=1
startretries=0
autorestart=false
stopsignal=TERM
stopwaitsecs=3650
; Let the API own graceful ASR shutdown. Kill the group only after its deadline.
stopasgroup=false
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:https]
command=/usr/local/bin/caddy run --config /app/docker/Caddyfile --adapter caddyfile
autostart=%(ENV_HTTPS_ENABLED)s
environment=XDG_DATA_HOME="/data",XDG_CONFIG_HOME="/config"
priority=20
startsecs=1
startretries=0
autorestart=false
stopsignal=TERM
stopwaitsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
